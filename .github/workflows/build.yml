name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build without launching
        run: bash ./build.command --no-open
      - name: Verify app bundle
        run: |
          plutil -lint build/M5ScrollBoost.app/Contents/Info.plist
          codesign --verify --deep --strict build/M5ScrollBoost.app
